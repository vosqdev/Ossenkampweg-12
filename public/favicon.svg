<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background rounded squircle with dark forest green -->
  <rect width="64" height="64" rx="16" fill="#1F2928" />
  
  <!-- Outer glowing energy ring / grid orbit -->
  <circle cx="32" cy="32" r="21" stroke="#509799" stroke-width="2.5" stroke-dasharray="8 4" stroke-linecap="round" opacity="0.85" />
  
  <!-- Orbital node dots representing connected energy points -->
  <circle cx="32" cy="11" r="3" fill="#63B9BB" />
  <circle cx="53" cy="32" r="3" fill="#63B9BB" />
  <circle cx="32" cy="53" r="3" fill="#63B9BB" />
  <circle cx="11" cy="32" r="3" fill="#63B9BB" />

  <!-- Inner battery/hub core circle -->
  <circle cx="32" cy="32" r="13" fill="#283A38" stroke="#63B9BB" stroke-width="2" />
  
  <!-- Central energy bolt / clean power icon in vibrant teal/mint -->
  <path d="M33.5 22L25 33H31.5L30.5 42L39 31H32.5L33.5 22Z" fill="#A7D7C5" stroke="#FFFFFF" stroke-width="0.75" stroke-linejoin="round" />
</svg>
